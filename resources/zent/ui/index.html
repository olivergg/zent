<!doctype html>
<!-- zent dashboard.
     The design thesis: a zent is the thread drawn through the warp on a loom,
     so the stack is drawn as fabric being woven. Warp = one vertical line per
     dependency level; components sit on it; the zent thread advances through
     them in topological order as they come up, and stops where a deploy broke.
     Nothing animates at rest - this is meant to sit on a second monitor.
     No remote fonts or CDN: it runs offline, straight out of `bin/zent ... --ui`.
     Its style is index.css, its code index.js. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- baked in at request time by zent.ui.server, read back by index.js's
     htmx:configRequest listener - see zent.ui.render's docstring
     for why writes stay a server round trip instead of a client fetch. -->
<meta name="csrf-token" content="{{CSRF_TOKEN}}">
<title>zent</title>
<link rel="stylesheet" href="/index.css">
</head>
<body>
  <header class="masthead">
    <h1 class="wordmark">zent <small class="version" title="the zent version this daemon runs">{{VERSION}}</small></h1>
    <nav class="tabs" id="tabs">
      <a href="#graph" data-tab="graph">Graph</a>
      <a href="#logs" data-tab="logs">Logs</a>
      <a href="#checks" data-tab="checks" id="checks-tab" hidden>Checks<span class="tab-badge" id="checks-badge" hidden></span></a>
    </nav>
    <div class="run" id="run" data-state="idle">
      <span class="run-label"><small id="run-caption">no run</small><span class="preset" id="preset"></span></span>
      <button type="button" class="run-toggle" id="run-toggle" hidden></button>
    </div>
    <span class="link" id="link">connecting</span>
    <button type="button" class="rail-toggle" id="rail-toggle" aria-pressed="true"
            aria-label="Side panel" title="Hide the side panel">
      <svg viewBox="0 0 20 16" width="20" height="16" aria-hidden="true">
        <rect x="0.75" y="0.75" width="18.5" height="14.5" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.5"/>
        <rect class="pane" x="12" y="0.75" width="7.25" height="14.5" stroke="currentColor" stroke-width="1.5"/>
      </svg>
    </button>
  </header>

  <main class="shell" id="shell">
    <section class="loom" id="loom" aria-label="component graph">
      <div class="preview-banner" id="preview-banner" hidden></div>
      <div class="levels ghost" id="ghost" aria-hidden="true"></div>
      <svg class="warp" id="warp" aria-hidden="true"></svg>
      <div class="levels" id="levels"></div>
    </section>

    <div class="grip" id="grip" role="separator" aria-orientation="vertical"
         title="Drag to resize &middot; double-click to reset"></div>

    <aside class="rail">
      <div id="rail-run">
        <div>
          <h2>presets</h2>
          <ul class="picker" id="preset-picker"></ul>
        </div>
        <div>
          <h2>run</h2>
          <div id="summary" class="quiet">Nothing running.</div>
        </div>
        <div>
          <h2>status</h2>
          <div class="legend">
            <span class="up"><i></i>up</span>
            <span class="done"><i></i>done</span>
            <span class="starting"><i></i>starting</span>
            <span class="stopping"><i></i>stopping</span>
            <span class="failed"><i></i>failed</span>
            <span><i></i>pending</span>
            <span class="external"><i></i>external</span>
            <span class="idle"><i></i>idle (kept warm)</span>
            <span><i></i>off</span>
          </div>
          <label class="show-stopped">
            <input type="checkbox" id="show-stopped">
            Show stopped
          </label>
        </div>
        <div>
          <h2>component</h2>
          <div id="detail" class="quiet">Select a component to see its status.</div>
        </div>
      </div>
    </aside>
  </main>

  <section class="checks-view" id="checks-view" aria-label="checks">
    <div class="left">
      <div class="checks-bar">
        <button type="button" id="checks-run-all">&#9654; run all</button>
        <button type="button" id="checks-run-failed">&#9654; rerun failing</button>
        <label><input type="checkbox" id="checks-only-failed"> show failing only</label>
      </div>
      <div id="checks-tree"></div>
      <div class="chk-history" id="checks-history"></div>
    </div>
    <div class="right" id="checks-detail"></div>
  </section>

  <section class="logs-view" id="logs-view" aria-label="logs">
    <div class="logs-bar">
      <span id="log-pills"></span>
      <input type="search" id="log-term" class="log-term" placeholder="filter: text or /regexp/" spellcheck="false">
      <span class="levels-filter" role="radiogroup" aria-label="level">
        <button type="button" data-level="" aria-pressed="true">all</button>
        <button type="button" data-level="warn" aria-pressed="false">warnings <b id="n-warn">0</b></button>
        <button type="button" data-level="error" aria-pressed="false">errors <b id="n-error">0</b></button>
      </span>
      <label><input type="checkbox" id="log-times"> times</label>
      <button type="button" class="log-act" id="log-copy" title="Copy the lines shown, without colour codes">copy</button>
      <button type="button" class="log-act" id="log-clear" title="Clear this view - new lines keep coming">clear</button>
    </div>
    <div class="logs-main">
      <div class="term" id="logs-term"></div>
      <button type="button" class="new-lines" id="new-lines" hidden></button>
    </div>
  </section>

<!-- what just happened, for a moment (index.js toast) -->
<div id="toasts" aria-live="polite"></div>

<!-- vendored, not CDN-loaded (BSD-0, no build step) - see zent.ui.render's
     docstring. Only used for hx-post/hx-disabled-elt on action buttons and
     manually-processed server-rendered fragments; the live push itself
     stays a plain WebSocket (see index.js's connect()) - the DAG layout needs
     :status/:deps as structured data, which htmx's own websocket
     extension (HTML-only) can't carry. -->
<script src="/htmx.min.js"></script>
<!-- vendored like htmx (MIT, ansi_up 5.2.1): the logs' terminal colours -->
<script src="/ansi_up.js"></script>
<!-- last, like the inline script it was: the DOM above is there when it runs -->
<script src="/index.js"></script>
</body>
</html>
